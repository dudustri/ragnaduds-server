<!-- RagnaDuds loading screen for the browser client (build/browser/Dockerfile puts it in roBrowser's api.html in
     place of its own spinner). Same look as the website: colours, fonts, background, scanlines, gold pixel title.
     roBrowser removes #ro-preloader once the game script has loaded. -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
	#ro-preloader {
		position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center;
		justify-content: center; gap: 28px; color: #f6ecd2; font: 22px/1.3 "VT323", ui-monospace, monospace;
		background: radial-gradient(ellipse at 50% -10%, #3a2d5c 0%, transparent 60%),
		            repeating-linear-gradient(0deg, #16132a 0 32px, #181530 32px 64px), #14121f;
	}
	#ro-preloader::after {   /* CRT scanlines + vignette, like the site */
		content: ""; position: absolute; inset: 0; pointer-events: none;
		background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
		            radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.45) 100%);
	}
	#ro-preloader .rd-title {
		margin: 0; font: clamp(22px, 5vw, 40px) "Press Start 2P", monospace; letter-spacing: .5px; color: #ffd166;
		text-shadow: 3px 3px 0 #7a3e12, 6px 6px 0 #000;
	}
	#ro-preloader .rd-bar {   /* pixel frame with a gold block sweeping across */
		position: relative; width: min(320px, 70vw); height: 22px; overflow: hidden; background: #221d33;
		border: 4px solid #000; box-shadow: inset 0 0 0 3px #6b4f2a, 4px 4px 0 #000;
	}
	#ro-preloader .rd-bar::before {
		content: ""; position: absolute; top: 3px; bottom: 3px; left: 0; width: 30%; background: #ffd166;
		box-shadow: inset -4px -4px 0 #c99a2e; animation: rd-sweep 1.2s steps(12) infinite;
	}
	@keyframes rd-sweep { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
	#ro-preloader .rd-text { margin: 0; color: #b9ab8a; }
	#ro-preloader.fade-out { opacity: 0; transition: opacity .3s; }
	@media (prefers-reduced-motion: reduce) { #ro-preloader .rd-bar::before { animation: none; width: 100%; } }
</style>
<div id="ro-preloader" role="status" aria-label="Loading RagnaDuds">
	<h1 class="rd-title">RAGNADUDS</h1>
	<div class="rd-bar"></div>
	<p class="rd-text">Loading the game…</p>
</div>
