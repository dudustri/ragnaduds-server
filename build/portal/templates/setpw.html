{{define "title"}}{{.L.set_title}}{{end}}
{{define "content"}}
<h1>{{if .Welcome}}{{.L.set_welcome}}{{else}}{{.L.set_h}}{{end}}</h1>
<section class="frame" style="max-width:560px;margin:18px auto">
  {{if .Welcome}}<p>{{tf .L.set_ready .Username}}</p>
  {{else}}<p>{{tf .L.set_for .Username}}</p>{{end}}
  {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
  <form method="post" action="/set-password">
    <input type="hidden" name="t" value="{{.Token}}">
    <input type="text" name="username" value="{{.Username}}" autocomplete="username" hidden>
    <label for="p1">{{.L.set_pw}}</label>
    <input type="password" id="p1" name="password" minlength="6" maxlength="23" required autocomplete="new-password" autofocus>
    <label for="p2">{{.L.set_again}}</label>
    <input type="password" id="p2" name="password2" minlength="6" maxlength="23" required autocomplete="new-password">
    <div class="actions"><button class="go" type="submit">{{.L.set_go}}</button></div>
  </form>
</section>
{{end}}
