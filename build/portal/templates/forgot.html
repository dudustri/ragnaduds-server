{{define "title"}}{{.L.forgot_title}}{{end}}
{{define "content"}}
<h1>{{.L.forgot_h}}</h1>
<section class="frame" style="max-width:560px;margin:18px auto">
  <p>{{.L.forgot_text}}</p>
  <form method="post" action="/forgot">
    <label for="e">{{.L.forgot_email}}</label>
    <input type="email" id="e" name="email" required autofocus>
    <div class="actions"><button class="go" type="submit">{{.L.forgot_go}}</button></div>
  </form>
  <p class="muted">{{.L.forgot_old}}</p>
</section>
{{end}}
