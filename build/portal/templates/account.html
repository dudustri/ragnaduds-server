{{define "title"}}{{.L.acc_title}}{{end}}
{{define "content"}}
<h1>{{.L.acc_h}}</h1>
<section class="frame">
  <h2>{{.Me.Username}}</h2>
  <p>{{.L.acc_email}} {{if .Me.Email}}<b>{{.Me.Email}}</b>{{else}}<span class="muted">{{.L.acc_noemail}}</span>{{end}}<br>
     {{.L.acc_same}}</p>
  <p><a class="btn go" href="/">{{.L.acc_site}}</a></p>
</section>
<section class="frame">
  <h2>{{.L.acc_change}}</h2>
  {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="text" name="username" value="{{.Me.Username}}" autocomplete="username" hidden>
    <label for="c">{{.L.acc_current}}</label>
    <input type="password" id="c" name="current" required autocomplete="current-password">
    <div class="row2">
      <div><label for="p1">{{.L.acc_new}}</label><input type="password" id="p1" name="password" minlength="6" maxlength="23" required autocomplete="new-password"></div>
      <div><label for="p2">{{.L.acc_again}}</label><input type="password" id="p2" name="password2" minlength="6" maxlength="23" required autocomplete="new-password"></div>
    </div>
    <div class="actions"><button class="go" type="submit">{{.L.acc_go}}</button></div>
  </form>
</section>
{{end}}
