<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RagnaDuds · Server Features</title>
<link rel="icon" href="img/favicon.ico?v=round" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=round">
<link rel="apple-touch-icon" href="img/ragnaduds-256.png?v=round">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<!-- Server features: everything the two servers have, with a Renewal / Pre-Renewal switch. Texts and data in
     features.js (EN / PT / DA), same language choice as the home page. Served at /features (Caddyfile: try_files). -->
<style>
  :root {
    --ink: #f6ecd2; --ink-dim: #b9ab8a; --bg: #14121f; --panel: #221d33; --panel-2: #2c2542;
    --edge: #6b4f2a; --edge-hi: #c9a25b; --pink: #ff8fb1; --green: #7ee081; --blue: #7cc4ff;
    --gold: #ffd166; --red: #ff6b6b; --px: 4px;
    --s1: 8px; --s2: 16px; --s3: 24px; --s5: 40px;   /* spacing scale (8px steps): tight inside a group, wider between groups */
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--ink); font: 22px/1.3 "VT323", ui-monospace, monospace; min-height: 100vh;
    background: radial-gradient(ellipse at 50% -10%, #3a2d5c 0%, transparent 60%),
                repeating-linear-gradient(0deg, #16132a 0 32px, #181530 32px 64px);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.45) 100%);
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 64px; position: relative; z-index: 1; }
  h1, h2, h3, .pixel { font-family: "Press Start 2P", monospace; letter-spacing: .5px; }
  h1 { font-size: clamp(18px, 4.4vw, 34px); margin: var(--s2) 0 var(--s3); text-align: center; color: var(--gold);
       text-shadow: 3px 3px 0 #7a3e12, 6px 6px 0 #000; }
  .lang { position: absolute; top: 14px; right: 16px; display: flex; border: 3px solid #000; box-shadow: 3px 3px 0 #000; }
  .lang button { font: 10px "Press Start 2P", monospace; padding: 8px 10px; border: 0; cursor: pointer; background: var(--panel-2); color: var(--ink); }
  .lang button[aria-pressed="true"] { background: var(--gold); color: #1b1203; }
  .back { display: inline-block; font: 10px "Press Start 2P", monospace; color: var(--ink); text-decoration: none;
          background: var(--panel-2); padding: 9px 11px; border: 3px solid #000; box-shadow: 3px 3px 0 #000; }
  .back:hover { background: var(--gold); color: #1b1203; }
  .frame { background: var(--panel); border: var(--px) solid var(--edge); margin: 18px 0; padding: 16px 20px 18px;
           box-shadow: inset 0 0 0 var(--px) #000, inset 0 0 0 calc(var(--px)*2) var(--edge-hi), 6px 6px 0 #000; }
  .frame h2 { font-size: 13px; color: var(--pink); margin: 4px 0 12px; line-height: 1.6; }
  .frame h2 .tag { font-size: 8px; vertical-align: middle; padding: 4px 6px; margin-left: 8px; border: 2px solid #000; color: #1b1203; }
  .tag.re { background: var(--blue); } .tag.pre { background: var(--pink); } .tag.both { background: var(--green); }
  .frame p { margin: 6px 0; }
  .frame ul { margin: 6px 0; padding-left: 22px; }
  .frame li { margin: 3px 0; }
  b, strong { color: var(--gold); font-weight: normal; }
  em { color: var(--blue); font-style: normal; }
  code { color: var(--green); font-family: inherit; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 20px; }
  th { font: 9px "Press Start 2P", monospace; color: var(--ink-dim); text-align: left; padding: 6px 8px; border-bottom: 2px solid #000; }
  td { padding: 5px 8px; border-bottom: 1px dashed #4a3f63; vertical-align: top; }
  td.c { color: var(--gold); white-space: nowrap; }
  .srv-switch { display: flex; justify-content: center; margin: 0 0 var(--s1); }
  .srv-switch div { display: flex; border: 3px solid #000; box-shadow: 3px 3px 0 #000; }
  .srv-switch button { font: 11px "Press Start 2P", monospace; padding: 10px 14px; border: 0; cursor: pointer; background: var(--panel-2); color: var(--ink); }
  .srv-switch button[aria-pressed="true"].re { background: var(--blue); color: #10131f; }
  .srv-switch button[aria-pressed="true"].pre { background: var(--pink); color: #1f1018; }
  /* server facts: an LED ticker that loops (static line when the OS asks for less motion) */
  .ticker { max-width: 640px; margin: 0 auto var(--s3); overflow: hidden; background: #0b0a14; border: 3px solid #000;
            box-shadow: 3px 3px 0 #000, inset 0 0 12px rgba(0,0,0,.8); padding: 6px 0;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
                    mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
  .ticker .track { display: flex; width: max-content; animation: tick var(--dur, 20s) linear infinite; }
  .ticker:hover .track { animation-play-state: paused; }
  .ticker .half { display: flex; flex-shrink: 0; }
  .ticker span { white-space: nowrap; padding: 0 14px; color: var(--ink); text-shadow: 0 0 6px rgba(255, 209, 102, .35); }
  .ticker span.sep { padding: 0; color: var(--srv, var(--blue)); text-shadow: 0 0 6px currentColor; }
  .ticker[data-srv="pre"] { --srv: var(--pink); }
  @keyframes tick { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) {
    .ticker { -webkit-mask-image: none; mask-image: none; text-align: center; }
    .ticker .track { animation: none; width: auto; justify-content: center; flex-wrap: wrap; }
    .ticker .half + .half { display: none; }
  }
  /* section buttons: balanced rows (4 + 4 with 8 sections), 2 per row on phones */
  .toc { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s1); margin: 0 0 var(--s3); }
  .toc a { text-align: center; display: flex; align-items: center; justify-content: center; line-height: 1.5; }
  .toc a { font: 8px "Press Start 2P", monospace; color: var(--ink); text-decoration: none; background: var(--panel-2);
           padding: 7px 8px; border: 2px solid #000; }
  .toc a { line-height: 1.7; }   /* after the font shorthand, which resets it */
  .toc a:hover { background: var(--gold); color: #1b1203; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 8px 0; }
  .stat { background: var(--panel-2); border: 3px solid #000; padding: 10px; text-align: center; }
  .stat .v { font: 18px "Press Start 2P", monospace; color: var(--gold); display: block; margin-bottom: 6px; }
  .stat .l { color: var(--ink-dim); font-size: 19px; }
  .scroll { overflow-x: auto; }
  footer { text-align: center; color: var(--ink-dim); font-size: 18px; margin-top: 28px; }
  @media (max-width: 600px) { .toc { grid-template-columns: repeat(2, minmax(0, 1fr)); } body { font-size: 20px; } table { font-size: 18px; } }
  /* top bar: in the page flow (never over the title); language = a setting on the left, account actions on the right */
  .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: var(--s5); }
  .topbar .lang { position: static; margin: 0; width: auto; }
  /* left = navigation (back), right = settings: account, then language last, the same on every page */
  .topbar .right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
  /* phones: row 1 = back + language, row 2 = account actions */
  @media (max-width: 560px) {
    .topbar .right { display: contents; }
    .topbar .lang { order: 1; margin-left: auto; }
    .topbar .user { order: 2; flex-basis: 100%; justify-content: flex-end; }
  }
  .user { display: flex; gap: 8px; }
  .user a { font: 10px "Press Start 2P", monospace; padding: 8px 10px; text-decoration: none; border: 3px solid #000; box-shadow: 3px 3px 0 #000;
            background: var(--panel-2); color: var(--ink); }
  .user a:hover, .user a:focus-visible { background: var(--gold); color: #1b1203; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="/" data-i18n="back"></a>
    <div class="right">
      <nav class="user" aria-label="Account"><a href="/account" data-i18n="myacc">MY ACCOUNT</a><a href="/logout" data-i18n="logout">LOG OUT</a></nav>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">EN</button><button data-lang="pt" aria-pressed="false">PT</button><button data-lang="da" aria-pressed="false">DA</button>
      </div>
    </div>
  </div>
  <h1 data-i18n="title"></h1>
  <div class="srv-switch"><div role="group" aria-label="Server">
    <button class="re" data-srv="re" aria-pressed="true">RENEWAL</button><button class="pre" data-srv="pre" aria-pressed="false">PRE-RENEWAL</button>
  </div></div>
  <div class="ticker" id="srvnote" role="note"></div>
  <nav class="toc" id="toc"></nav>
  <div id="sections"></div>
  <footer data-i18n="footer"></footer>
</div>
<script src="features.js"></script>
</body>
</html>
