<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RagnaDuds · Downloads</title>
<link rel="icon" href="img/favicon.ico?v=round" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=round">
<link rel="apple-touch-icon" href="img/ragnaduds-256.png?v=round">
<meta property="og:image" content="img/ragnaduds-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f6ecd2; --ink-dim: #b9ab8a; --bg: #14121f; --panel: #221d33; --panel-2: #2c2542;
    --edge: #6b4f2a; --edge-hi: #c9a25b; --pink: #ff8fb1; --green: #7ee081; --blue: #7cc4ff;
    --gold: #ffd166; --red: #ff6b6b; --px: 4px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--ink); font: 22px/1.25 "VT323", ui-monospace, monospace; min-height: 100vh;
    background: radial-gradient(ellipse at 50% -10%, #3a2d5c 0%, transparent 60%),
                repeating-linear-gradient(0deg, #16132a 0 32px, #181530 32px 64px);
  }
  body::after {                                   /* CRT scanlines + vignette */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.45) 100%);
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 64px; position: relative; z-index: 1; }
  h1, h2, .pixel { font-family: "Press Start 2P", monospace; letter-spacing: .5px; }
  h1 { font-size: clamp(22px, 5vw, 40px); margin: 8px 0 6px; text-align: center; color: var(--gold);
       text-shadow: 3px 3px 0 #7a3e12, 6px 6px 0 #000; }
  .tagline { text-align: center; color: var(--ink-dim); margin: 0 0 18px; }
  .flag { display: inline-block; width: 22px; height: 15px; vertical-align: -2px; border: 2px solid #000; background: #000; }
  .flag svg { display: block; width: 100%; height: 100%; }

  /* language switch */
  .lang { position: absolute; top: 14px; right: 16px; display: flex; border: 3px solid #000; box-shadow: 3px 3px 0 #000; }
  .lang button { font: 10px "Press Start 2P", monospace; padding: 8px 10px; border: 0; cursor: pointer; background: var(--panel-2); color: var(--ink); }
  .lang button[aria-pressed="true"] { background: var(--gold); color: #1b1203; }

  /* wooden RPG frame */
  .frame { background: var(--panel); border: var(--px) solid var(--edge); margin: 18px 0; padding: 18px 20px;
           box-shadow: inset 0 0 0 var(--px) #000, inset 0 0 0 calc(var(--px)*2) var(--edge-hi), 6px 6px 0 #000; }

  /* ---------- stage: Duds on a Peco Peco vs the Poring ---------- */
  .stage { position: relative; overflow: hidden; padding: 0; aspect-ratio: 608 / 328;
           background: #3d5d1e url(img/orc-map.jpg) center / cover no-repeat; }
  .walker { position: absolute; left: 0; top: 0; translate: -50% -100%; transition: opacity .5s; }
  .walker .body { transform-origin: 50% 100%; }
  .walker img { display: block; width: 100%; image-rendering: pixelated; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35));
                animation: waddle .5s ease-in-out infinite; transform-origin: 50% 100%; }
  .walker.idle img { animation-duration: 1.6s; }
  .walker.poring img { animation: hop .7s ease-in-out infinite; }
  .walker.poring.idle img { animation-duration: 1.4s; }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1.08, .92) } 50% { transform: translateY(-35%) scale(.95, 1.05) } }
  @keyframes waddle { 0%,100% { transform: rotate(-3deg) translateY(0) } 50% { transform: rotate(3deg) translateY(-4%) } }
  .walker.dead { opacity: 0; transition: none; }
  .walker.fighting img, .walker.poring.fighting img { animation: shake .12s steps(2) infinite; }
  @keyframes shake { 50% { transform: translateX(5px) rotate(4deg) } }
  .ragdoll { position: absolute; left: 0; top: 0; pointer-events: none; image-rendering: pixelated; z-index: 999; }
  .pow { position: absolute; font: 14px "Press Start 2P", monospace; color: var(--gold); z-index: 1000; translate: -50% -100%;
         text-shadow: 2px 2px 0 #7a3e12, 4px 4px 0 #000; pointer-events: none; animation: pop .6s steps(3) infinite; }
  @keyframes pop { 50% { transform: scale(1.3) rotate(-6deg) } }
  .tomb { position: absolute; font: 10px "Press Start 2P", monospace; color: #fff; text-align: center; translate: -50% -100%; text-shadow: 1px 1px 0 #000; }
  .tomb::before { content: ""; display: block; width: 22px; height: 26px; margin: 0 auto 2px; background: #8d8d99;
                  border-radius: 11px 11px 2px 2px; box-shadow: inset -4px -4px 0 #5f5f6b, 0 0 0 3px #000; }
  .stage:focus { outline: 3px dashed var(--gold); outline-offset: -8px; }
  .hint { position: absolute; right: 10px; bottom: 6px; font-size: 16px; color: #fff; text-shadow: 1px 1px 0 #000, 0 0 4px #000; z-index: 1001; pointer-events: none; }
  .killfeed { position: absolute; left: 10px; top: 8px; font-size: 20px; color: var(--green); z-index: 1001;
              text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; }

  /* collage: photo + die-cut stickers on matter.js springs */
  .collage-frame { padding: 14px; }
  .collage-wrap { display: grid; grid-template-columns: minmax(0, 520px) 1fr; gap: 22px; align-items: center; }
  .confession h3 { font: 13px/1.6 "Press Start 2P", monospace; color: var(--gold); margin: 0 0 12px; text-shadow: 2px 2px 0 #7a3e12; }
  .confession p { margin: 0 0 12px; }
  .confession b { color: var(--pink); font-weight: normal; }
  .confession .sig { color: var(--blue); text-align: right; margin-top: 16px; }
  @media (max-width: 760px) { .collage-wrap { grid-template-columns: 1fr; } }
  .collage-wrap { align-items: stretch; }
  .side { display: flex; flex-direction: column; gap: 20px; padding-top: 6px; }
  .collage { align-self: start; }
  .side .confession { margin-top: auto; }   /* letter sits at the bottom, level with the photo; the ranking grows into the space */
  .hof { }
  .side .confession { border-top: 3px dashed var(--edge); padding-top: 18px; }
  .hof-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .hof h3 { font: 12px "Press Start 2P", monospace; color: var(--gold); margin: 0; text-shadow: 2px 2px 0 #7a3e12; }
  .hof-tabs { display: flex; border: 3px solid #000; }
  .hof-tabs button { font: 9px "Press Start 2P", monospace; padding: 6px 8px; border: 0; cursor: pointer; background: var(--panel-2); color: var(--ink); }
  .hof-tabs button[aria-pressed="true"] { background: var(--gold); color: #1b1203; }
  .hof ol { margin: 0; padding: 0; list-style: none; }
  .hof-cols, .hof-top li { display: grid; grid-template-columns: 22px minmax(0, 1fr) 38px 38px 60px; column-gap: 12px;
                           align-items: baseline; padding: 3px 8px; }
  .hof-cols { font: 8px "Press Start 2P", monospace; color: var(--ink-dim); padding-bottom: 7px; border-bottom: 2px solid #000; margin-bottom: 3px; }
  .hof-cols span:nth-child(n+3), .hof-top .n, .hof-top .lv { text-align: right; }
  .hof-top li { font-size: 18px; line-height: 1.3; }
  .hof-top li:nth-child(odd) { background: rgba(0,0,0,.25); }
  .hof-top li.empty, .hof-badges li.empty { display: block; background: none; }
  .hof-top .n { font: 10px "Press Start 2P", monospace; }
  .hof-top .n.mvp { color: var(--gold); } .hof-top .n.pvp { color: var(--red); } .hof-top .n.zero { color: #5a5470; }
  .hof-top .rk { font: 10px "Press Start 2P", monospace; color: var(--ink-dim); }
  .hof-top li:nth-child(1) .rk { color: var(--gold); } .hof-top li:nth-child(2) .rk { color: #d8d8e8; } .hof-top li:nth-child(3) .rk { color: #d08a4a; }
  .hof-top .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hof-top .nm small { color: var(--ink-dim); font-size: 15px; margin-left: 6px; }
  .hof-top .on { color: var(--green); font-size: 13px; }
  .hof-top .lv { color: var(--blue); white-space: nowrap; font-size: 17px; }
  .hof-badges { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; padding: 0 8px; }
  .hof-sub { font: 9px "Press Start 2P", monospace; color: var(--pink); margin-bottom: 6px; }
  .hof-badges li { font-size: 17px; display: flex; justify-content: space-between; gap: 6px; line-height: 1.25; }
  .hof-badges li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hof-badges li span:last-child { color: var(--gold); }
  .hof .empty { color: var(--ink-dim); font-size: 18px; padding: 4px 8px; }
  .status-card h2 { font-size: 14px; color: var(--green); margin: 0 0 12px; }
  .srv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .srv { background: rgba(0,0,0,.3); border: 3px solid #000; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .srv-name { font: 12px "Press Start 2P", monospace; color: var(--pink); }
  .srv.re .srv-name { color: var(--blue); }
  .srv-online { grid-column: 1 / -1; color: var(--ink-dim); }
  .srv-online b { color: var(--ink); font: 16px "Press Start 2P", monospace; margin-right: 4px; }
  .srv-foot { margin-top: 10px; color: var(--ink-dim); font-size: 17px; }
  .collage { margin: 0 auto; width: 100%; position: relative; width: 100%; aspect-ratio: 3 / 4; overflow: hidden; border: var(--px) solid #000;
             background: #0a1a40 url(img/collage/base.jpg) center / cover; box-shadow: 4px 4px 0 #000; touch-action: pan-y; }
  .collage img { position: absolute; left: 0; top: 0; user-select: none; -webkit-user-drag: none; will-change: transform;
                 filter: drop-shadow(3px 5px 4px rgba(0,0,0,.45)); cursor: grab; touch-action: none; }
  .collage img.pixel { image-rendering: pixelated; }
  .collage img.title { cursor: default; filter: none; touch-action: auto; pointer-events: none; }
  .collage img:active { cursor: grabbing; }
  .collage .glow { position: absolute; width: 14%; aspect-ratio: 3 / 1; border-radius: 50%; translate: -50% -50%; pointer-events: none;
                   background: radial-gradient(rgba(255,240,160,.9), rgba(255,209,102,0) 70%); opacity: 0; transition: opacity .6s; }
  .collage .glow.on { opacity: 1; animation: glow 1.4s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: .45 } }

  /* NPC dialog */
  .npc { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: start; cursor: pointer; user-select: none; }
  .npc img { width: 96px; height: 96px; image-rendering: pixelated; border: var(--px) solid #000; box-shadow: 4px 4px 0 #000; }
  .npc .name { color: var(--blue); margin-bottom: 6px; font-size: 12px; }
  .npc .text { min-height: 3.8em; }
  .npc .next { float: right; color: var(--gold); font-size: 10px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0 } }

  /* download slots */
  .slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin: 18px 0; scroll-margin-top: 12px; }
  .slots > .frame { margin: 0; }   /* one spacing rule: 18px between every card */
  .cta { text-align: center; margin: 0 0 4px; }
  .cta .btn { font-size: 11px; padding: 10px 14px; }
  html { scroll-behavior: smooth; }
  .slot { position: relative; transition: transform .15s ease; }
  .slot:hover { transform: translate(-2px,-2px); }
  .slot h2 { font-size: 15px; margin: 0 0 10px; color: var(--pink); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .live { font: 9px "Press Start 2P", monospace; padding: 4px 6px; border: 2px solid #000; background: #000; letter-spacing: 0; }
  .live.online { color: var(--green); } .live.offline { color: var(--red); } .live.starting { color: var(--gold); }
  .live.online::first-letter { animation: blink 1.4s steps(2) infinite; }
  .slot.re h2 { color: var(--blue); }
  .slot .row { display: flex; gap: 14px; align-items: center; }
  .slot canvas { image-rendering: pixelated; flex: none; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
  .tag { background: #000; color: var(--ink-dim); padding: 0 6px; font-size: 18px; }
  .btn { display: inline-block; font: 12px "Press Start 2P", monospace; color: #1b1203; text-decoration: none;
         background: var(--gold); padding: 12px 14px; border: var(--px) solid #000;
         box-shadow: inset -4px -4px 0 #c99a2e, 4px 4px 0 #000; transition: transform .08s, box-shadow .08s; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translate(4px,4px); box-shadow: inset -4px -4px 0 #c99a2e; }
  .btn[aria-disabled="true"] { background: #555; color: #999; box-shadow: 4px 4px 0 #000; pointer-events: none; }
  .status { margin-top: 8px; color: var(--ink-dim); font-size: 18px; }

  /* lag-o-meter */
  .meter { display: grid; grid-template-columns: 130px 1fr 80px; gap: 10px; align-items: center; margin: 8px 0; }
  .bar { height: 18px; background: #000; border: 2px solid #444; position: relative; }
  .bar i { position: absolute; inset: 0; width: 0; background: repeating-linear-gradient(90deg, var(--green) 0 10px, #5cbf5f 10px 12px); transition: width 1.2s steps(12); }
  .bar.bad i { background: repeating-linear-gradient(90deg, var(--red) 0 10px, #d94d4d 10px 12px); }

  /* tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { font: 11px "Press Start 2P", monospace; color: var(--ink); background: var(--panel-2); border: 3px solid #000; padding: 10px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--gold); color: #1b1203; }
  ol { margin: 0; padding-left: 1.3em; } li { margin: 4px 0; }
  code { font: inherit; background: #000; padding: 0 6px; color: var(--green); }
  .rules li::marker { color: var(--gold); }
  .rules li:last-child { color: var(--gold); }
  footer { text-align: center; color: var(--ink-dim); font-size: 18px; margin-top: 28px; }

  #physics { position: fixed; inset: 0; z-index: 40; display: none; }
  @media (max-width: 560px) {
    .hof-cols, .hof-top li { grid-template-columns: 18px minmax(0, 1fr) 30px 30px 52px; column-gap: 8px; padding: 3px 4px; }
    .lang { position: static; width: max-content; margin: 0 0 10px auto; }   /* don't cover the title */
    .hint { display: none; }                                                   /* the map is too small for it */
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 560px) { .npc { grid-template-columns: 64px 1fr; } .npc img { width: 64px; height: 64px; } .meter { grid-template-columns: 90px 1fr 64px; } }
</style>
</head>
<body>
<canvas id="physics"></canvas>

<div class="wrap">
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en" aria-pressed="true">EN</button><button data-lang="pt" aria-pressed="false">PT</button><button data-lang="da" aria-pressed="false">DA</button>
  </div>

  <h1>RAGNADUDS</h1>
  <p class="tagline"><span data-i18n="tag1"></span> · <span class="flag"><svg viewBox="0 0 37 28"><rect width="37" height="28" fill="#c8102e"/><rect x="12" width="4" height="28" fill="#fff"/><rect y="12" width="37" height="4" fill="#fff"/></svg></span> × <span class="flag"><svg viewBox="0 0 20 14"><rect width="20" height="14" fill="#009c3b"/><polygon points="10,1.6 18.4,7 10,12.4 1.6,7" fill="#ffdf00"/><circle cx="10" cy="7" r="3.4" fill="#002776"/><path d="M6.7 6.3 Q10 5.4 13.3 7.6" stroke="#fff" stroke-width=".7" fill="none"/></svg></span> · <span data-i18n="tag2"></span></p>

  <p class="cta"><a class="btn" href="#downloads" data-i18n="cta"></a></p>

  <div class="frame stage" id="stage" tabindex="0" aria-label="Mini game: Duds vs the Orc">
    <div class="killfeed" id="killfeed"></div>
    <div class="hint" data-i18n="stagehint"></div>
    <div class="walker" id="dudsWalk"><div class="body"><img src="img/peco-duds.png" alt=""></div></div>
    <div class="walker" id="orcWalk"><div class="body"><img src="img/orc.png" alt=""></div></div>
  </div>

  <div class="frame npc" id="npc" data-i18n-title="clickme">
    <img src="img/ragnaduds-npc.png" alt="RagnaDuds" width="96" height="96">
    <div>
      <div class="name pixel" data-i18n="npcname"></div>
      <div class="text" id="talk"></div>
      <span class="next pixel" data-i18n="click"></span>
    </div>
  </div>

  <section class="frame status-card">
    <h2 class="pixel" data-i18n="statustitle"></h2>
    <div class="srv-grid">
      <div class="srv pre"><div class="srv-name">PRE-RENEWAL</div><span class="live offline" data-live="pre">…</span>
        <div class="srv-online"><b data-online="pre">–</b> <span data-i18n="playerson"></span></div></div>
      <div class="srv re"><div class="srv-name">RENEWAL</div><span class="live offline" data-live="re">…</span>
        <div class="srv-online"><b data-online="re">–</b> <span data-i18n="playerson"></span></div></div>
    </div>
    <div class="srv-foot" id="srvFoot"></div>
  </section>

  <section class="frame">
    <h2 class="pixel" style="font-size:14px;color:var(--green);margin:0 0 10px">LAG-O-METER™</h2>
    <div class="meter"><span data-i18n="dk"></span><div class="bar"><i data-ms="99"></i></div><span>99 ms</span></div>
    <div class="meter"><span data-i18n="br"></span><div class="bar"><i data-ms="113"></i></div><span>113 ms</span></div>
    <div class="meter"><span data-i18n="you"></span><div class="bar" id="youBar"><i></i></div><span id="youMs">… ms</span></div>
    <div style="color:var(--ink-dim)" data-i18n="lagnote"></div>
  </section>

  <section class="frame collage-frame">
    <div class="collage-wrap">
      <div class="collage" id="collage"><div class="glow" id="cardGlow"></div></div>
      <div class="side">
        <div class="hof">
          <div class="hof-head"><h3 data-i18n="hoftitle"></h3>
            <div class="hof-tabs"><button type="button" data-hof="pre" aria-pressed="false">PRE</button><button type="button" data-hof="re" aria-pressed="true">RE</button></div></div>
          <div class="hof-cols" aria-hidden="true"><span>#</span><span data-i18n="hofname"></span><span>MVP</span><span>PVP</span><span>LV</span></div>
          <ol class="hof-top" id="hofTop"></ol>
          <div class="hof-badges">
            <div><div class="hof-sub" data-i18n="hofrich"></div><ol id="hofRich"></ol></div>
            <div><div class="hof-sub" data-i18n="hofmvp"></div><ol id="hofMvp"></ol></div>
          </div>
        </div>
        <div class="confession" data-i18n="confession"></div>
      </div>
    </div>
  </section>

  <div class="slots" id="downloads">
    <section class="frame slot pre">
      <h2>PRE-RENEWAL</h2>
      <div class="row"><canvas data-sprite="sword" data-scale="4"></canvas><div data-i18n="pretext"></div></div>
      <div class="tags"><span class="tag">client 2021-11-03</span><span class="tag">English</span><span class="tag">port 6900</span><span class="tag" data-size="pre">…</span></div>
      <a class="btn" href="files/duds-pre-renewal.zip" data-i18n="download"></a>
      <div class="status" data-status="pre"></div>
    </section>
    <section class="frame slot re">
      <h2>RENEWAL</h2>
      <div class="row"><canvas data-sprite="chest" data-scale="4"></canvas><div data-i18n="retext"></div></div>
      <div class="tags"><span class="tag">client 2026-01-07</span><span class="tag">English</span><span class="tag">port 6901</span><span class="tag" data-size="re">…</span></div>
      <a class="btn" href="files/duds-renewal.zip" data-i18n="download"></a>
      <div class="status" data-status="re"></div>
    </section>
  </div>

  <section class="frame">
    <h2 class="pixel" style="font-size:14px;color:var(--gold);margin:0 0 12px" data-i18n="howto"></h2>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="win">WINDOWS</button>
      <button role="tab" aria-selected="false" data-tab="lin">LINUX</button>
      <button role="tab" aria-selected="false" data-tab="mac">MAC</button>
    </div>
    <div data-panel="win"><ol data-i18n="win"></ol></div>
    <div data-panel="lin" hidden><ol data-i18n="lin"></ol></div>
    <div data-panel="mac" hidden><ol data-i18n="mac"></ol></div>
  </section>

  <section class="frame">
    <h2 class="pixel" style="font-size:14px;color:var(--pink);margin:0 0 12px" data-i18n="rulestitle"></h2>
    <ol class="rules" data-i18n="rules"></ol>
  </section>

  <footer><span data-i18n="footer"></span><br><span style="font-size:15px">psst: ↑ ↑ ↓ ↓ ← → ← → B A</span></footer>
</div>

<script>
const matterReady = loadMatter();      // matter.js: stage ragdolls, collage stickers, Poring rain
// ======================= texts (EN / PT) =======================
const LOCALE = { en: "en", pt: "pt-BR", da: "da-DK" };   // number/date formats per language
const T = {
  en: {
    tag1: "the Duds Server · est. 2026", tag2: "no rules, just chill",
    npcname: "[RagnaDuds, Kafra intern]", click: "▼ click", clickme: "click to continue",

  const p = clampWalk(w.x + dx / len * sp, w.y + dy / len * sp * .8);
  w.x = p.x; w.y = p.y; if (Math.abs(dx) > .5) w.face = Math.sign(dx);
  w.el.classList.toggle("idle", false);
}
const WIN = { orc: .5, poring: .8 };                                // Duds' odds when they bump into each other
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  walkers.forEach(w => { step(w, dt); place(w); });
  if (duds.alive && !duds.busy) for (const m of enemies) {
    if (!m.alive || m.busy) { m.touching = false; continue; }
    const near = Math.abs(duds.x - m.x) < (m.kind === "orc" ? 24 : 16) && Math.abs(duds.y - m.y) < 14;
    if (near && attackIntent && duds.target === m) { fight(m, m.kind === "orc" ? .65 : .95); break; }   // you attacked
    if (near && !m.touching && Math.random() < .35) { m.touching = true; fight(m, WIN[m.kind]); break; } // 35% brawl
    m.touching = near;
  }
  requestAnimationFrame(tick);
}

function fight(foe, dudsWinChance) {
  attackIntent = false; duds.target = null;
  const pair = [duds, foe];
  pair.forEach(w => { w.busy = true; w.el.classList.add("fighting"); w.face = Math.sign((w === duds ? foe : duds).x - w.x) || 1; place(w); });
  const s = sc(), pow = document.createElement("div"); pow.className = "pow";
  pow.textContent = ["POW!", "BONK!", "CRIT!", "SLAP!", "MISS!"][Math.random() * 5 | 0];
  pow.style.left = (duds.x + foe.x) / 2 * s + "px"; pow.style.top = (Math.min(duds.y, foe.y) - 66) * s + "px"; stage.appendChild(pow);
  setTimeout(() => {
    pow.remove(); pair.forEach(w => { w.el.classList.remove("fighting"); w.busy = false; });
    const loser = Math.random() < dudsWinChance ? foe : duds, winner = loser === duds ? foe : duds;
    loser.alive = false; ragdoll(loser, winner);
    feed.textContent = loser === duds ? (foe.kind === "orc" ? T[LANG].killDuds : T[LANG].killDudsPoring)
                                      : (foe.kind === "orc" ? T[LANG].killOrc : T[LANG].killPoring);
    const tomb = document.createElement("div"); tomb.className = "tomb"; tomb.textContent = "RIP";
    tomb.style.left = loser.x * s + "px"; tomb.style.top = loser.y * s + "px"; tomb.style.zIndex = Math.round(loser.y);
    setTimeout(() => stage.appendChild(tomb), 900);
    setTimeout(() => {                                              // respawn somewhere away from the winner
      tomb.remove(); if (!document.querySelector(".pow")) feed.textContent = "";
      let p = randomSpot();
      for (let i = 0; i < 30 && Math.hypot(p.x - winner.x, p.y - winner.y) < 100; i++) p = randomSpot();
      Object.assign(loser, p, { target: null, pause: 1, touching: false }); place(loser);
      loser.el.classList.remove("dead"); loser.alive = true;
    }, rnd(3000, 5500));
  }, 1100);
}

// matter.js ragdoll: the loser gets launched, spins, bounces off the walls and the ground, then fades
let stagePhys = null;
async function ragdoll(w, winner) {
  const r = w.el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  w.el.classList.add("dead");
  try { await matterReady; } catch { return; }
  const { Engine, Bodies, Composite, Body, Events } = Matter;
  if (!stagePhys) {
    const engine = Engine.create(), W = stage.clientWidth, H = stage.clientHeight, o = { isStatic: true };
    Composite.add(engine.world, [Bodies.rectangle(W / 2, H + 25, W * 3, 50, o), Bodies.rectangle(-25, H / 2, 50, H * 3, o),
                                 Bodies.rectangle(W + 25, H / 2, 50, H * 3, o)]);
    stagePhys = { engine, items: [] };
    Events.on(engine, "afterUpdate", () => stagePhys.items.forEach(({ body, img, iw, ih }) => {
      img.style.transform = `translate(${body.position.x - iw / 2}px, ${body.position.y - ih / 2}px) rotate(${body.angle}rad)`;
    }));
    const phys = stagePhys; (function loop() { if (stagePhys !== phys) return; if (phys.items.length) Engine.update(engine, 1000 / 60); requestAnimationFrame(loop); })();
  }
  const img = w.img.cloneNode(); img.className = "ragdoll"; img.style.width = r.width + "px"; stage.appendChild(img);
  const iw = r.width, ih = r.height, body = Bodies.rectangle(r.left - sr.left + iw / 2, r.top - sr.top + ih / 2, iw * .8, ih * .8,
                                                             { restitution: .55, friction: .3 });
  const away = Math.sign(w.x - winner.x) || 1;
  Body.setVelocity(body, { x: away * rnd(6, 11), y: -rnd(12, 17) }); Body.setAngularVelocity(body, away * rnd(.2, .4));
  Composite.add(stagePhys.engine.world, body); const item = { body, img, iw, ih }; stagePhys.items.push(item);
  setTimeout(() => { img.style.transition = "opacity .6s"; img.style.opacity = 0; }, 1800);
  const phys = stagePhys; setTimeout(() => { Composite.remove(phys.engine.world, body); img.remove(); phys.items.splice(phys.items.indexOf(item), 1); }, 2500);
}
addEventListener("resize", () => { walkers.forEach(place); if (stagePhys) { Matter.Composite.clear(stagePhys.engine.world, false); stagePhys = null; } });
walkers.forEach(w => w.img.complete ? place(w) : w.img.addEventListener("load", () => place(w)));

// ======================= collage: photo + stickers hanging on matter.js springs =======================
const collage = document.getElementById("collage");
async function buildCollage() {
  const L = await (await fetch("img/collage/layout.json", { cache: "no-store" })).json();
  const ver = u => u + "?v=" + (L.v || 0);          // new collage build = new file names for the browser cache
  collage.style.backgroundImage = `url(${ver(L.base)})`;
  const title = new Image(); title.src = ver(L.title.img); title.className = "title"; title.alt = "RagnaDuds"; collage.appendChild(title);
  const items = await Promise.all(L.stickers.map(st => new Promise(ok => {
    const img = new Image(); img.src = ver(st.img); img.alt = ""; img.draggable = false; if (st.pixel) img.className = "pixel";
    img.onload = () => ok({ st, img, w: st.w, h: st.w * img.naturalHeight / img.naturalWidth }); img.onerror = () => ok(null);
    collage.appendChild(img);
  }))).then(a => a.filter(Boolean));
  const glow = document.getElementById("cardGlow");
  function render() {
    const s = collage.clientWidth / L.w;
    title.style.width = L.title.w * s + "px"; title.style.transform = `translate(${(L.w - L.title.w) / 2 * s}px, ${(L.title.y - L.title.h / 2) * s}px)`;
    for (const it of items) {
      const x = it.body ? it.body.position.x : it.st.x, y = it.body ? it.body.position.y : it.st.y;
      const a = it.body ? it.body.angle : it.st.rot * Math.PI / 180;
      it.img.style.width = it.w * s + "px";
      it.img.style.transform = `translate(${(x - it.w / 2) * s}px, ${(y - it.h / 2) * s}px) rotate(${a}rad)`;
    }
    const card = items.find(i => i.st.name === "card");
    if (card) { glow.style.left = card.st.x / L.w * 100 + "%"; glow.style.top = (card.st.y + card.h * .35) / L.h * 100 + "%"; }
  }
  render(); addEventListener("resize", render);
  try { await matterReady; } catch { return; }
  if (reduced) { glow.classList.add("on"); return; }

  const { Engine, Bodies, Body, Composite, Constraint, Events, Vector } = Matter;
  const engine = Engine.create(); engine.gravity.y = 0;
  const springs = it => {                                            // two springs (top + bottom) keep position AND tilt
    const a = it.st.rot * Math.PI / 180, off = it.h * .3;
    return [-1, 1].map(k => Constraint.create({ pointA: Vector.add({ x: it.st.x, y: it.st.y }, Vector.rotate({ x: 0, y: k * off }, a)),
      bodyB: it.body, pointB: Vector.rotate({ x: 0, y: k * off }, it.body.angle), length: 0, stiffness: .014, damping: .1, render: { visible: false } }));
  };
  for (const it of items) {
    it.body = Bodies.rectangle(it.st.x, it.st.y, it.w, it.h, { frictionAir: .06, collisionFilter: { group: -1 } });
    Body.setAngle(it.body, it.st.rot * Math.PI / 180);
    if (it.st.name === "card") { Body.setPosition(it.body, { x: it.st.x, y: -it.h }); it.falling = true; }
    else Composite.add(engine.world, [it.body, ...springs(it)]);
  }
  // the card drop: falls from the sky with gravity, bounces on the floor, then hangs on springs like the rest
  const card = items.find(i => i.st.name === "card");
  let dropped = false;
  function drop() {
    if (!card || dropped) return; dropped = true;
    const floor = Bodies.rectangle(card.st.x, card.st.y + card.h / 2 + 30, 900, 60, { isStatic: true, collisionFilter: { group: 1, category: 2, mask: 2 } });
    card.body.collisionFilter = { group: 0, category: 2, mask: 2 }; card.body.restitution = .45; card.body.frictionAir = .01;
    Body.setAngularVelocity(card.body, .15);
    Composite.add(engine.world, [floor, card.body]);
    let still = 0;
    const fall = () => {
      if (!card.falling) return;
      Body.applyForce(card.body, card.body.position, { x: 0, y: card.body.mass * .0022 });
      still = card.body.speed < .3 && card.body.position.y > card.st.y - 60 ? still + 1 : 0;
      if (still > 30) {
        card.falling = false; Composite.remove(engine.world, floor); card.body.collisionFilter = { group: -1 }; card.body.frictionAir = .06;
        Composite.add(engine.world, springs(card)); glow.classList.add("on");
      }
    };
    Events.on(engine, "beforeUpdate", fall);
  }
  Events.on(engine, "afterUpdate", render);
  // drag & throw with the pointer
  let grab = null;
  const toBase = e => { const r = collage.getBoundingClientRect(), s = r.width / L.w; return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s }; };
  for (const it of items) it.img.addEventListener("pointerdown", e => {
    if (it.falling) return;
    e.preventDefault(); it.img.setPointerCapture(e.pointerId);
    const p = toBase(e), local = Vector.rotate(Vector.sub(p, it.body.position), -it.body.angle);
    grab = Constraint.create({ pointA: p, bodyB: it.body, pointB: Vector.rotate(local, it.body.angle), stiffness: .15, damping: .1 });
    grab.local = local; Composite.add(engine.world, grab);
  });
  addEventListener("pointermove", e => { if (grab) { grab.pointA = toBase(e); grab.pointB = Vector.rotate(grab.local, grab.bodyB.angle); } });
  addEventListener("pointerup", () => { if (grab) { Composite.remove(engine.world, grab); grab = null; } });
  // a little life: now and then a sticker gets a nudge
  setInterval(() => {
    const it = items[Math.random() * items.length | 0]; if (!it.falling && !grab)
      Body.applyForce(it.body, Vector.add(it.body.position, { x: 0, y: -it.h / 3 }), { x: rnd(-1, 1) * it.body.mass * .0012, y: 0 });
  }, 1400);
  // only simulate while visible; the card drops the first time you scroll to it
  let visible = false;
  new IntersectionObserver(([en]) => { visible = en.isIntersecting; if (visible) setTimeout(drop, 400); }, { threshold: .35 }).observe(collage);
  (function loop() { if (visible || grab) Engine.update(engine, 1000 / 60); requestAnimationFrame(loop); })();
}
buildCollage();

// ======================= easter egg: Konami → physics Poring rain (Matter.js) =======================
const KONAMI = "ArrowUp,ArrowUp,ArrowDown,ArrowDown,ArrowLeft,ArrowRight,ArrowLeft,ArrowRight,b,a";
let konami = [], raining = false;
addEventListener("keydown", e => { konami = [...konami, e.key].slice(-10); if (konami.join(",") === KONAMI) rain(); });
function loadMatter() {
  return window.Matter ? Promise.resolve() : new Promise((ok, fail) => {
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js";
    s.onload = ok; s.onerror = fail; document.head.appendChild(s);
  });
}
async function rain() {
  if (raining || reduced) return; raining = true; say(T[LANG].rain);
  try { await loadMatter(); } catch { raining = false; return; }
  const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint } = Matter;
  const cv = document.getElementById("physics"); cv.style.display = "block";
  const W = innerWidth, H = innerHeight, engine = Engine.create();
  const render = Render.create({ canvas: cv, engine, options: { width: W, height: H, wireframes: false, background: "transparent", pixelRatio: 1 } });
  const wall = { isStatic: true, render: { visible: false } };
  Composite.add(engine.world, [Bodies.rectangle(W / 2, H + 30, W * 2, 60, wall), Bodies.rectangle(-30, H / 2, 60, H * 2, wall), Bodies.rectangle(W + 30, H / 2, 60, H * 2, wall)]);
  const tex = document.createElement("canvas"); draw(tex, "blob", 4); const url = tex.toDataURL();
  let n = 0; const drop = setInterval(() => {
    Composite.add(engine.world, Bodies.circle(40 + Math.random() * (W - 80), -60, 24, {
      restitution: .7, friction: .05, render: { sprite: { texture: url, xScale: 1, yScale: 1 } } }));
    if (++n >= 70) clearInterval(drop);
  }, 60);
  const mouse = Mouse.create(cv);
  Composite.add(engine.world, MouseConstraint.create(engine, { mouse, constraint: { stiffness: .2, render: { visible: false } } }));
  const runner = Runner.create(); Runner.run(runner, engine); Render.run(render);
  setTimeout(() => {                                         // clean up after 20 s
    clearInterval(drop); Render.stop(render); Runner.stop(runner); Composite.clear(engine.world, false); Engine.clear(engine);
    cv.getContext("2d").clearRect(0, 0, W, H); cv.style.display = "none"; raining = false;
  }, 20000);
}
