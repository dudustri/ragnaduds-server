# Everything that runs: both game servers + the download page. Images only: no source code needed.
# Per-host settings live in hosts/<host>/ (git-ignored): .env (passwords, ports, volumes) + game configs.
#   ../duds.sh up local            → docker compose --env-file hosts/local/.env up -d
#   ../duds.sh up vm               → copies this folder to the VM, pulls images, starts
# Each game stack has its own network with the aliases db/login/char/map its configs expect.
name: duds

x-rathena: &rathena
    init: true
    restart: unless-stopped
    # Denmark time (CET/CEST) as a POSIX rule: works without tzdata in the images. Daily resets happen at midnight here.
    environment: { TZ: "CET-1CEST,M3.5.0,M10.5.0/3" }

services:
    # ---------------- pre-renewal (client 2021-11-03) ----------------
    prere-db:
        image: "ghcr.io/dudustri/duds-server-db:${TAG:-latest}"
        restart: unless-stopped
        environment: { TZ: "CET-1CEST,M3.5.0,M10.5.0/3", MYSQL_ROOT_PASSWORD: "${PRERE_DB_PASS}", MYSQL_DATABASE: ragnarok, MYSQL_USER: ragnarok, MYSQL_PASSWORD: "${PRERE_DB_PASS}" }
        volumes: ["prere_db:/var/lib/mysql"]
        networks: { prere: { aliases: [db] } }
    prere-login:
        <<: *rathena
        image: "ghcr.io/dudustri/duds-server-pre-renewal:${TAG:-latest}"
        command: sh -c "until nc -z db 3306; do sleep 2; done; exec ./login-server"
        volumes: ["${HOST_DIR}/pre_renewal/import:/rathena/conf/import:z"]
        ports: ["6900:6900"]
        networks: { prere: { aliases: [login] } }
        depends_on: [prere-db]
    prere-char:
        <<: *rathena
        image: "ghcr.io/dudustri/duds-server-pre-renewal:${TAG:-latest}"
        command: sh -c "until nc -z db 3306; do sleep 2; done; exec ./char-server"
        volumes: ["${HOST_DIR}/pre_renewal/import:/rathena/conf/import:z"]
        ports: ["6121:6121"]
        networks: { prere: { aliases: [char] } }
        depends_on: [prere-login]
    prere-map:
        <<: *rathena
        stdin_open: true   # console input: ./duds.sh gm <host> <re|pre> @command (no restart needed)
        image: "ghcr.io/dudustri/duds-server-pre-renewal:${TAG:-latest}"
        command: sh -c "until nc -z db 3306; do sleep 2; done; exec ./map-server"
        volumes:
            - "${HOST_DIR}/pre_renewal/import:/rathena/conf/import:z"
            - "${HOST_DIR}/pre_renewal/import/scripts_custom.conf:/rathena/npc/scripts_custom.conf:ro,z"   # our NPCs: survive @reloadscript
            - "./gm_commands.txt:/rathena/npc/custom/duds_gm_commands.txt:ro,z"   # @god / @nocooldown
            - "./welcome.txt:/rathena/npc/custom/duds_welcome.txt:ro,z"   # random welcome line
            - "./buffer.txt:/rathena/npc/custom/duds_buffer.txt:ro,z"     # Agente VIP at the bRO spots
            - "./motd.txt:/rathena/conf/motd.txt:ro,z"
        ports: ["5121:5121"]
        networks: { prere: { aliases: [map] } }
        depends_on: [prere-char]

    prere-web:      # account settings + guild emblems for the client (2020+ clients ask for it)
        <<: *rathena
        image: "ghcr.io/dudustri/duds-server-pre-renewal:${TAG:-latest}"
        command: sh -c "until nc -z db 3306; do sleep 2; done; exec ./web-server"
        volumes: ["${HOST_DIR}/pre_renewal/import:/rathena/conf/import:z"]
        ports: ["8889:8889"]
        networks: [prere]
        depends_on: [prere-db]

    # ---------------- renewal (client 2026-01-07) ----------------
    re-db:
        image: "ghcr.io/dudustri/duds-server-db:${TAG:-latest}"
        restart: unless-stopped
        environment: { TZ: "CET-1CEST,M3.5.0,M10.5.0/3", MYSQL_ROOT_PASSWORD: "${RE_DB_PASS}", MYSQL_DATABASE: ragnarok, MYSQL_USER: ragnarok, MYSQL_PASSWORD: "${RE_DB_PASS}" }
        volumes: ["re_db:/var/lib/mysql"]
        networks: { re: { aliases: [db] } }
    re-login:
        <<: *rathena
        image: "ghcr.io/dudustri/duds-server-renewal:${TAG:-latest}"
        command: sh -c "until nc -z db 3306; do sleep 2; done; exec ./login-server"
        volumes: ["${HOST_DIR}/renewal/import:/rathena/conf/import:z"]
        ports: ["6901:6901"]
        networks: { re: { aliases: [login] } }
        depends_on: [re-db]
    re-char:
        <<: *rathena
        image: "ghcr.io/dudustri/duds-server-renewal:${TAG:-latest}"
        command: sh -c "until nc -z db 3306; do sleep 2; done; exec ./char-server"
        volumes: ["${HOST_DIR}/renewal/import:/rathena/conf/import:z"]
        ports: ["6122:6122"]
        networks: { re: { aliases: [char] } }
        depends_on: [re-login]
    re-map:
        <<: *rathena
        stdin_open: true   # console input: ./duds.sh gm <host> <re|pre> @command (no restart needed)
        image: "ghcr.io/dudustri/duds-server-renewal:${TAG:-latest}"
        command: sh -c "until nc -z db 3306; do sleep 2; done; exec ./map-server"
        volumes:
            - "${HOST_DIR}/renewal/import:/rathena/conf/import:z"
            - "${HOST_DIR}/renewal/import/scripts_custom.conf:/rathena/npc/scripts_custom.conf:ro,z"   # our NPCs: survive @reloadscript
            - "./gm_commands.txt:/rathena/npc/custom/duds_gm_commands.txt:ro,z"
            - "./welcome.txt:/rathena/npc/custom/duds_welcome.txt:ro,z"   # random welcome line
            - "./buffer.txt:/rathena/npc/custom/duds_buffer.txt:ro,z"     # Agente VIP at the bRO spots
            - "./motd.txt:/rathena/conf/motd.txt:ro,z"
            - "./cash_points.txt:/rathena/npc/custom/duds_cash_points.txt:ro,z"   # cash points by playing (@points)
            - "./homunculus_room.txt:/rathena/npc/custom/duds_homunculus_room.txt:ro,z"   # private homunculus training rooms (alchemists)
            - "./ticket_refiner.txt:/rathena/npc/custom/duds_ticket_refiner.txt:ro,z"   # Refine Master: certificates also for level 2 armor / level 5 weapons
            - "./jobmaster.txt:/rathena/npc/custom/duds_jobmaster.txt:ro,z"   # Job Master: fourth class from any third class
            - "./stylist.txt:/rathena/npc/custom/duds_stylist.txt:ro,z"   # Stylist: clothes colours per class
            - "./fourth_quests.txt:/rathena/npc/custom/duds_fourth_quests.txt:ro,z"   # 4th job change quests (Cardinal, Biolo, Dragon Knight)
            - "./fourth_quests_a.txt:/rathena/npc/custom/duds_fourth_quests_a.txt:ro,z"
            - "./fourth_quests_b.txt:/rathena/npc/custom/duds_fourth_quests_b.txt:ro,z"
            - "./fourth_quests_c.txt:/rathena/npc/custom/duds_fourth_quests_c.txt:ro,z"
            - "./fourth_quests_d.txt:/rathena/npc/custom/duds_fourth_quests_d.txt:ro,z"
            - "./casino.txt:/rathena/npc/custom/duds_casino.txt:ro,z"                      # Comodo Casino (art: casino/build_casino_art.py)
            - "./mvp_room.txt:/rathena/npc/custom/etc/mvp_room.txt:ro,z"   # Private MVP Room (Prontera): our copy, more MVPs
            # bRO special maps (Mapas Especiais, Cheffenia, Turn In): script + rooms, tickets, cash shop
            - "./special_maps.txt:/rathena/npc/custom/duds_special_maps.txt:ro,z"
            - "./re_db_import/instance_db.yml:/rathena/db/import/instance_db.yml:ro,z"
            - "./re_db_import/item_db.yml:/rathena/db/import/item_db.yml:ro,z"
            - "./re_db_import/item_cash.yml:/rathena/db/import/item_cash.yml:ro,z"
            - "./re_db_import/level_penalty.yml:/rathena/db/import/level_penalty.yml:ro,z"   # no EXP level penalty
            - "./re_db_import/skill_db.yml:/rathena/db/import/skill_db.yml:ro,z"   # Call Homunculus: no 30-minute limit
            - "./re_db_import/mob_db.yml:/rathena/db/import/mob_db.yml:ro,z"   # official 4th job quest monsters (client Ids)
        ports: ["5122:5122"]
        networks: { re: { aliases: [map] } }
        depends_on: [re-char]

    re-web:         # account settings + guild emblems for the client (2020+ clients ask for it)
        <<: *rathena
        image: "ghcr.io/dudustri/duds-server-renewal:${TAG:-latest}"
        command: sh -c "until nc -z db 3306; do sleep 2; done; exec ./web-server"
        volumes: ["${HOST_DIR}/renewal/import:/rathena/conf/import:z"]
        ports: ["8888:8888"]
        networks: [re]
        depends_on: [re-db]

    # ---------------- download page ----------------
    web:
        image: "ghcr.io/dudustri/duds-server-web:${TAG:-latest}"
        restart: unless-stopped
        environment: { TZ: "CET-1CEST,M3.5.0,M10.5.0/3", DL_TOKEN: "${DL_TOKEN:?run ./duds.sh set-password <host> <user>}", SITE_ADDRESS: "${SITE_ADDRESS:-:80}" }
        ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
        volumes: ["./files:/srv/files:ro,z", "web_data:/data", "status:/srv/site/status:ro"]
        networks: [web]
        depends_on: [portal]

    # ---------------- account requests, website login, password reset, admin (build/portal) ----------------
    portal:
        image: "ghcr.io/dudustri/duds-server-portal:${TAG:-latest}"
        restart: unless-stopped
        environment:
            TZ: "CET-1CEST,M3.5.0,M10.5.0/3"
            SITE_URL: "${PORTAL_URL:-https://ragnaduds.duckdns.org}"
            RE_DB_PASS: "${RE_DB_PASS}"
            PRERE_DB_PASS: "${PRERE_DB_PASS}"
            GAME_MD5: "${GAME_MD5:-1}"                 # game passwords stored as MD5 (login_conf use_MD5_passwords: yes)
            ADMIN_EMAIL: "${ADMIN_EMAIL:-}"            # daily "requests waiting" e-mail
            SMTP_HOST: "${SMTP_HOST:-}"                # e.g. smtp.gmail.com (with an app password) (empty: mails only kept in the outbox)
            SMTP_PORT: "${SMTP_PORT:-587}"
            SMTP_USER: "${SMTP_USER:-}"
            SMTP_PASS: "${SMTP_PASS:-}"
            MAIL_FROM: "${MAIL_FROM:-}"                # e.g. "RagnaDuds <ragnaduds@gmail.com>" (the SMTP account's own address)
        volumes: ["portal_data:/data"]
        networks: [web, prere, re]

    # ---------------- server status + Hall of Fame for the website (deploy/status.sh) ----------------
    status:
        image: "ghcr.io/dudustri/duds-server-db:${TAG:-latest}"   # only for its mariadb client + bash
        restart: unless-stopped
        environment: { TZ: "CET-1CEST,M3.5.0,M10.5.0/3", PRERE_DB_PASS: "${PRERE_DB_PASS}", RE_DB_PASS: "${RE_DB_PASS}" }
        entrypoint: ["bash", "/status.sh"]
        volumes: ["./status.sh:/status.sh:ro,z", "status:/out"]
        networks: [prere, re]

networks:
    prere: {}
    re: {}
    web: {}

volumes:
    prere_db: { name: "${PRERE_DB_VOLUME:-duds_prere_db}" }
    re_db: { name: "${RE_DB_VOLUME:-duds_re_db}" }
    web_data: {}
    portal_data: {}
    status: {}
