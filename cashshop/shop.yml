# RagnaDuds Cash Shop (renewal) - EDIT THIS, then run:  python3 cashshop/build_shop.py
# Each tab lists  item: price  (item = Id or AegisName; price = points, or "auto": by level, weapons x1.5:
#   below lv100 = 100, lv100-169 = 200, lv170-189 = 400, lv190+ = 600).
# The builder checks every item in the server DB and in the game client, and fixes missing names, icons and
# looks (see build_shop.py). Tabs the client knows: New, Hot, Limited, Rental, Permanent, Scrolls, Consumables,
# Other, Sale.

# worn look for items whose own look the client can't draw: item Id -> Id of an item whose look to use
